{% extends "base.html" %}

{% block title %}Sign In - DeckGen{% endblock %}

{% block content %}
<!-- Use a highly styled background exclusively for auth -->
<div class="flex-grow flex items-center justify-center p-6 relative overflow-hidden -mt-20"> <!-- -mt-20 offsets the navbar height to center nicely -->
    
    <!-- Immersive Background Orbs -->
    <div class="absolute top-1/2 left-1/4 w-96 h-96 bg-brand-500 rounded-full mix-blend-multiply filter blur-[120px] opacity-40 animate-blob transform -translate-x-1/2 -translate-y-1/2"></div>
    <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-[120px] opacity-40 animate-blob animation-delay-2000 transform translate-x-1/2 -translate-y-1/2"></div>
    
    <div class="w-full max-w-md space-y-8 rounded-3xl glass-card border border-white/50 dark:border-gray-700/50 shadow-[0_0_50px_rgba(79,70,229,0.15)] z-10 text-gray-900 dark:text-white relative p-8 sm:p-10">
        
        <!-- Header Text -->
        <div class="text-center">
            <div class="mx-auto w-12 h-12 rounded-xl bg-gradient-to-br from-brand-500 to-pink-500 flex items-center justify-center text-white font-display font-bold text-2xl shadow-lg mb-6">
                D
            </div>
            <h2 class="text-3xl font-display font-extrabold tracking-tight">Welcome back</h2>
            <p class="mt-2 text-sm text-gray-500 dark:text-gray-400 font-medium">Log in to your account or register a new one to start creating.</p>
        </div>

        <!-- HTMX target container for form swapping -->
        <div id="auth-container">
            <!-- Included by default: login form -->
            {% include "partials/login_form.html" %}
        </div>
        
    </div>
</div>
{% endblock %}
