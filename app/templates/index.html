{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2 style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem;">Create Your Pitch Deck</h2>
    
    <form action="/submit" method="POST" id="pitchForm" enctype="multipart/form-data">
        <div class="grid-2">
            <div class="form-group">
                <label for="company_name">Company Name *</label>
                <input type="text" id="company_name" name="company_name" required placeholder="e.g. Acme Corp">
            </div>
            <div class="form-group">
                <label for="tagline">Tagline *</label>
                <input type="text" id="tagline" name="tagline" required placeholder="e.g. Revolutionizing the industry">
            </div>
        </div>

        <div class="form-group">
            <label for="problem">The Problem *</label>
            <textarea id="problem" name="problem" required placeholder="What problem are you solving?"></textarea>
            <div class="helper-text">Briefly describe the pain point your customers face.</div>
        </div>

        <div class="form-group">
            <label for="solution">The Solution *</label>
            <textarea id="solution" name="solution" required placeholder="How does your product solve the problem?"></textarea>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="target_customer">Target Customer *</label>
                <input type="text" id="target_customer" name="target_customer" required placeholder="e.g. B2B SaaS Companies">
            </div>
            <div class="form-group">
                <label for="industry">Industry *</label>
                <input type="text" id="industry" name="industry" required placeholder="e.g. Artificial Intelligence">
            </div>
        </div>
        
        <div class="form-group">
            <label for="business_model">Business Model *</label>
            <input type="text" id="business_model" name="business_model" required placeholder="e.g. Subscription based (SaaS)">
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="competitors">Competitors *</label>
                <input type="text" id="competitors" name="competitors" required placeholder="e.g. Company X, Company Y">
            </div>
            <div class="form-group">
                <label for="unique_advantage">Unique Advantage *</label>
                <input type="text" id="unique_advantage" name="unique_advantage" required placeholder="What makes you stand out?">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>Company Stage</label>
                <select name="stage">
                    <option value="IDEA">Idea Stage</option>
                    <option value="MVP">MVP Ready</option>
                    <option value="SALES">Generating Sales</option>
                </select>
            </div>
            <div class="form-group">
                <label>Goal of Pitch Deck</label>
                <select name="goal_of_deck">
                    <option value="INVESTOR">Investment / Fundraising</option>
                    <option value="SALES">Sales / B2B Client</option>
                    <option value="COLLEGE_PROJECT">College / Academic Project</option>
                </select>
            </div>
            <div class="form-group">
                <label>Preferred Tone</label>
                <select name="prefered_tone">
                    <option value="CORPORATE">Corporate & Professional</option>
                    <option value="MINIMAL">Minimal & Clean</option>
                    <option value="BOLD">Bold & Energetic</option>
                    <option value="FUN">Fun & Creative</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-top: 1.5rem;">
            <label for="logo">Company Logo (Optional)</label>
            <input type="file" id="logo" name="logo" accept="image/*" style="padding: 0.5rem 0;">
            <div class="helper-text">Upload a logo to include it in the pitch deck.</div>
        </div>

        <div style="margin-top: 3rem;">
            <button type="submit" class="btn" id="submitBtn">
                <div class="loader" id="submitLoader"></div>
                <span id="submitText">Generate Pitch Deck</span>
            </button>
        </div>
    </form>
</div>

<script>
    document.getElementById('pitchForm').addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        const loader = document.getElementById('submitLoader');
        const text = document.getElementById('submitText');
        
        btn.disabled = true;
        loader.style.display = 'block';
        text.innerText = 'Creating Job...';
        
        // Small timeout to allow form to submit
        setTimeout(() => {
            btn.disabled = true;
        }, 10);
    });
</script>
{% endblock %}
