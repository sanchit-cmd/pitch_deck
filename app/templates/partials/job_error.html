<div id="job-status-container" class="w-full h-full flex flex-col items-center justify-center text-center p-6 bg-red-50/50 rounded-xl border border-red-100">
    <div class="flex items-center justify-center w-20 h-20 bg-red-100 text-red-600 rounded-full shadow-inner mb-6">
        <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
    </div>
    
    <h3 class="text-xl font-bold text-gray-900 mb-2">Generation Failed</h3>
    <p class="text-gray-600 max-w-md mb-4 text-sm">{{ error_message | default("An unexpected error occurred during generation.") }}</p>
    
    <button onclick="window.location.reload()" class="mt-4 px-6 py-2 border border-transparent text-sm font-medium rounded-lg shadow-sm text-white bg-gray-600 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-500 transition-colors">
        Try Again
    </button>
</div>
