<form hx-post="/auth/login" hx-target="#login-error-message" hx-swap="outerHTML" class="space-y-6">
                
    <div id="login-error-message"></div>

    <div class="space-y-4">
        <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 dark:text-gray-200">Email or Username</label>
            <div class="mt-1.5">
                <input id="email" name="email" type="text" autocomplete="email" required class="appearance-none block w-full px-4 py-3 bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all font-medium text-gray-900 dark:text-white sm:text-sm">
            </div>
        </div>

        <div>
            <div class="flex items-center justify-between">
                <label for="password" class="block text-sm font-semibold text-gray-700 dark:text-gray-200">Password</label>
                <a href="#" class="text-xs font-medium text-brand-600 dark:text-brand-400 hover:text-brand-500">Forgot password?</a>
            </div>
            <div class="mt-1.5">
                <input id="password" name="password" type="password" autocomplete="current-password" required class="appearance-none block w-full px-4 py-3 bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all font-medium text-gray-900 dark:text-white sm:text-sm">
            </div>
        </div>
    </div>

    <div class="pt-2">
        <button type="submit" class="w-full flex items-center justify-center py-3.5 px-4 rounded-xl shadow-[0_0_15px_rgba(79,70,229,0.3)] text-sm font-bold text-white bg-gradient-to-r from-brand-600 to-indigo-500 hover:to-indigo-400 hover:from-brand-500 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transform transition-all active:scale-[0.98]">
            Sign in
        </button>
    </div>

    <div class="text-sm text-center pt-2">
        <span class="text-gray-500 dark:text-gray-400 font-medium">Don't have an account?</span>
        <button type="button" hx-get="/auth/register-form" hx-target="#auth-container" hx-swap="innerHTML" class="font-bold text-brand-600 dark:text-brand-400 hover:text-brand-500 transition-colors ml-1 focus:outline-none">
            Register here
        </button>
    </div>
</form>
