<form hx-post="/auth/register" hx-target="#register-error-message" hx-swap="outerHTML" class="space-y-6">
                
    <div id="register-error-message"></div>

    <div class="space-y-4">
        <div>
            <label for="reg-email" class="block text-sm font-medium text-gray-200">Email address</label>
            <div class="mt-1">
                <input id="reg-email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-4 py-3 border border-gray-600 rounded-lg shadow-sm placeholder-gray-400 bg-gray-800/50 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all sm:text-sm">
            </div>
        </div>

        <div>
            <label for="reg-password" class="block text-sm font-medium text-gray-200">Password</label>
            <div class="mt-1">
                <input id="reg-password" name="password" type="password" required class="appearance-none block w-full px-4 py-3 border border-gray-600 rounded-lg shadow-sm placeholder-gray-400 bg-gray-800/50 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all sm:text-sm">
            </div>
        </div>
    </div>

    <div>
        <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-transform active:scale-95">
            Create Account
        </button>
    </div>

    <div class="text-sm text-center">
        <span class="text-gray-400">Already have an account?</span>
        <button type="button" hx-get="/auth/login-form" hx-target="#auth-container" hx-swap="innerHTML" class="font-medium text-indigo-400 hover:text-indigo-300 transition-colors ml-1 focus:outline-none">
            Sign in
        </button>
    </div>
</form>
