<form hx-post="/auth/register" hx-target="#register-error-message" hx-swap="outerHTML" class="space-y-6 animate-fade-in">
                
    <div id="register-error-message"></div>

    <div class="space-y-4">
        <div>
            <label for="reg-username" class="block text-sm font-semibold text-gray-700 dark:text-gray-200">Username</label>
            <div class="mt-1.5">
                <input id="reg-username" name="username" type="text" required class="appearance-none block w-full px-4 py-3 bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all font-medium text-gray-900 dark:text-white sm:text-sm">
            </div>
        </div>

        <div>
            <label for="reg-email" class="block text-sm font-semibold text-gray-700 dark:text-gray-200">Email address</label>
            <div class="mt-1.5">
                <input id="reg-email" name="email" type="email" autocomplete="email" required class="appearance-none block w-full px-4 py-3 bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all font-medium text-gray-900 dark:text-white sm:text-sm">
            </div>
        </div>

        <div>
            <label for="reg-password" class="block text-sm font-semibold text-gray-700 dark:text-gray-200">Password</label>
            <div class="mt-1.5">
                <input id="reg-password" name="password" type="password" required class="appearance-none block w-full px-4 py-3 bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all font-medium text-gray-900 dark:text-white sm:text-sm">
            </div>
        </div>
    </div>

    <div class="pt-2">
        <button type="submit" class="w-full flex items-center justify-center py-3.5 px-4 rounded-xl shadow-[0_0_15px_rgba(79,70,229,0.3)] text-sm font-bold text-white bg-gradient-to-r from-brand-600 to-indigo-500 hover:to-indigo-400 hover:from-brand-500 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transform transition-all active:scale-[0.98]">
            Create Account
        </button>
    </div>

    <div class="text-sm text-center pt-2">
        <span class="text-gray-500 dark:text-gray-400 font-medium">Already have an account?</span>
        <button type="button" hx-get="/auth/login-form" hx-target="#auth-container" hx-swap="innerHTML" class="font-bold text-brand-600 dark:text-brand-400 hover:text-brand-500 transition-colors ml-1 focus:outline-none">
            Sign in here
        </button>
    </div>
</form>
