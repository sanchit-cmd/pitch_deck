<div id="job-status-container" hx-get="/htmx/jobs/{{ job_id }}/status" hx-trigger="every 5s" class="w-full h-full flex flex-col items-center justify-center text-center p-6 bg-indigo-50/50 rounded-xl border border-indigo-100">
    <div class="relative w-24 h-24 mb-6">
        <!-- Ping animation -->
        <div class="absolute inset-0 bg-indigo-400 rounded-full animate-ping opacity-20"></div>
        <div class="relative flex items-center justify-center w-full h-full bg-indigo-100 text-indigo-600 rounded-full shadow-inner">
            <svg class="h-10 w-10 animate-spin" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
    </div>
    
    <h3 class="text-xl font-bold text-gray-900 mb-2">Generating your Pitch Deck...</h3>
    <p class="text-gray-600 max-w-sm mb-4">Our AI agents are currently crafting compelling content, selecting beautiful layouts, and generating stunning custom images for your brand.</p>
    
    <!-- Progress Indicator -->
    <div class="w-full max-w-sm bg-gray-200 rounded-full h-2 mb-2 overflow-hidden shadow-inner">
        <div class="bg-indigo-600 h-2 rounded-full w-2/3 animate-pulse"></div>
    </div>
    <p class="text-sm font-medium text-indigo-600">Please wait. This usually takes 1-3 minutes.</p>
</div>
