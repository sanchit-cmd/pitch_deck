<div id="job-status-container" class="w-full h-full flex flex-col items-center justify-center text-center p-6 bg-green-50/50 rounded-xl border border-green-100 transition-all">
    <div class="flex items-center justify-center w-24 h-24 bg-green-100 text-green-600 rounded-full shadow-lg mb-6">
        <svg class="h-12 w-12 drop-shadow-sm" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
    </div>
    
    <h3 class="text-2xl font-bold text-gray-900 mb-2">Deck Generation Complete!</h3>
    <p class="text-gray-600 max-w-sm mb-8">Your premium pitch deck has been successfully generated and compiled into a high-quality PDF.</p>
    
    <a href="/api/v1/jobs/{{ job_id }}/download" target="_blank" class="flex items-center justify-center px-8 py-4 border border-transparent text-lg font-medium rounded-xl text-white bg-green-600 hover:bg-green-700 shadow-xl hover:shadow-2xl transition-all hover:scale-105 group">
        <svg class="w-6 h-6 mr-3 group-hover:-translate-y-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        Download PDF Now
    </a>
    
    <button onclick="window.location.reload()" class="mt-6 text-sm text-gray-500 hover:text-indigo-600 underline underline-offset-4 decoration-indigo-300 transition-colors">Generate another deck</button>
</div>
